[project]
name = "pico-pubmed-rag"
version = "0.1.0"
description = "Clinical evidence-support tool: case -> candidate PICO questions -> PubMed search -> grounded evidence summary. Practice prototype, not a clinical tool."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "kagglehub>=1.0.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
